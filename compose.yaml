services:
  lanpulse:
    build:
      context: .
    container_name: lanpulse
    restart: unless-stopped
    ports:
      - "18090:8080"
    volumes:
      - lanpulse-data:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  lanpulse-data:
    # Keep the existing Docker volume name so upgrades preserve saved settings.
    name: phone-performance-monitor-data
